# Security headers for the static app (included per location: nginx drops inherited add_header
# directives as soon as a location defines its own, and the proxied API sets its own via helmet).
#
# CSP: everything is self-hosted except the basemap (style, tiles, glyphs, sprites fetched from
# OpenFreeMap). Workers: the track decoder and MapLibre's worker are same-origin modules; MapLibre
# may also start workers from blob: URLs. Styles are applied through the DOM API (React, MapLibre),
# which CSP does not restrict, so no 'unsafe-inline' is needed. No upgrade-insecure-requests: the
# stack serves plain HTTP on localhost; TLS belongs to whatever terminates it in front.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
