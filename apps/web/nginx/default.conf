# nginx for the web image (docker compose): serves the static build and proxies /api to the API
# service, so the browser sees one origin (no CORS). On Vercel the app calls the API cross-origin
# instead (ADR-006); this file is only used by the container.

# nginx's mime.types has no .mjs entry, and nosniff makes browsers refuse to run a module served as
# application/octet-stream (MapLibre's modules under /vendor). This block adds to mime.types.
types {
    text/javascript mjs;
}

# Docker's embedded DNS: re-resolve the api service, so recreating that container alone (new IP)
# does not leave nginx proxying to the old address.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:3000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Files are precompressed at build time (gzip -9); nginx serves the .gz twin when accepted.
    gzip_static on;
    # Fallback for anything not precompressed. Small API JSON stays uncompressed, as the API
    # itself decides (compression threshold 1 KB); larger API responses arrive compressed already.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    gzip_vary on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The API trusts exactly one proxy hop (TRUST_PROXY_HOPS=1) to find the client IP for
        # rate limiting: this one. Overwritten, never appended, so clients cannot spoof it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # The tracks download is 512 KB (brotli): buffer it in memory rather than a temp file.
        proxy_buffers 32 16k;
        proxy_busy_buffers_size 64k;
    }

    # Fingerprinted bundles and the versioned MapLibre modules never change: cache for a year.
    location ~ ^/(assets|vendor)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The HTML entry point is revalidated on every visit so a deploy is picked up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
