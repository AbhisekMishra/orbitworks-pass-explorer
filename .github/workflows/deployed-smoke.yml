name: Deployed smoke test

# After each successful production deploy on Vercel (which reports a GitHub deployment status),
# load the live site in a browser: production CSP, the cross-origin API on Railway (CORS), workers,
# and the brief's UAE example end to end. Also runnable by hand against any URL.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to test (defaults to the PRODUCTION_URL repository variable)
        required: false

permissions:
  contents: read

jobs:
  smoke:
    name: Browser smoke test of the deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@ow/web..."
      - name: Install Chromium
        run: pnpm --filter @ow/web exec playwright install --with-deps chromium
      # The production alias, not the per-deployment URL: that is the origin the API's CORS allows
      # and the one users open (deployment URLs may also sit behind Vercel's login).
      - name: Browser smoke test
        env:
          SMOKE_BASE_URL: ${{ inputs.url || vars.PRODUCTION_URL }}
        run: |
          test -n "$SMOKE_BASE_URL" || { echo 'Set the PRODUCTION_URL repository variable'; exit 1; }
          pnpm --filter @ow/web smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: deployed-smoke-report
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
